  return `<input id="${id}" class="${cls}" data-bind="${esc(bind)}" value="${esc(value)}" ${o.num !== false ? 'inputmode="decimal"' : ""} ${o.ph ? `placeholder="${esc(o.ph)}"` : ""} aria-label="${esc(o.label || bind)}" autocomplete="off">`;
}
function getPath(obj, path) { return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function setPath(obj, path, v) { const ks = path.split("."); let o = obj; ks.slice(0, -1).forEach((k) => { if (typeof o[k] !== "object" || o[k] === null) o[k] = {}; o = o[k]; }); o[ks.at(-1)] = v; }

/* ---------- model ---------- */
function item(id) {
  const b = D.items.find((x) => x.id === id), o = S.prices[id] || {};
  return { ...b,
    size: has(o.size) ? num(o.size) : b.size,
    vol: has(o.vol) ? num(o.vol) : b.vol,
    price: has(o.price) ? num(o.price) : (o.price === "" ? NaN : b.price),
    seller: has(o.seller) ? o.seller : b.seller };
}
const core = () => D.core.map((c) => {
  const it = item(slug(c.name));
  const parts = has(S.premix.parts[c.name]) ? num(S.premix.parts[c.name]) : c.parts;
  const cpl = has(S.premix.cups[c.name]) ? num(S.premix.cups[c.name]) : c.cupsPerLb;
  return { ...c, it, parts, cpl };
});

function compute() {
  const p = S.plan;
  const pot = num(p.potSize), pots = num(p.pots), r = num(p.rockPct) / 100, b = num(p.barkPct) / 100;
  const bc = Math.min(Math.max(num(p.biochar) / 100, 0), 0.95), cpc = num(p.cupsPerCuft, 3);
  const coco = item("coco-coir-block"), rock = item(p.rock === "Lava rock" ? "lava-rock" : "clay-pebbles");
  const hull = item("rice-hulls"), comp = item("compost-bagged"), cast = item("worm-castings"), bark = item("pine-bark-fines");
  const hs = Math.max(0, 1 - r - b);
  const bags = (need, vol) => (need > 0 && vol > 0 ? Math.ceil(need / vol - 0.0001) : 0);
  const pr = (x) => (isFinite(x) ? x : 0);
  const opts = Array.from({ length: 12 }, (_, i) => {
    const n = i + 1, C = n * coco.vol;
    const o = { n, dry: n * coco.size, C,
      rockB: r === 0 ? 0 : bags(C * r, rock.vol), hullB: r + b >= 1 ? 0 : bags(C * hs, hull.vol),
      compB: bags(C * 2 / 3, comp.vol), castB: bags(C / 3, cast.vol), barkB: b === 0 ? 0 : bags(C * b, bark.vol) };
    o.H = C * 3 / (1 - bc); o.gal = o.H * GPC; o.yd = o.H / 27;
    o.left = (o.rockB * rock.vol - C * r) + (o.hullB * hull.vol - C * hs) + (o.compB * comp.vol - C * 2 / 3) + (o.castB * cast.vol - C / 3) + (o.barkB * bark.vol - C * b);
    o.leftPct = o.H ? o.left / o.H : 0;
    o.cost = n * pr(coco.price) + o.rockB * pr(rock.price) + o.hullB * pr(hull.price) + o.compB * pr(comp.price) + o.castB * pr(cast.price) + o.barkB * pr(bark.price);
    o.premixGal = o.H * cpc / 16; o.potsFilled = pot > 0 ? Math.floor(o.gal / pot) : 0;
    return o;
  });
  const need = pot * pots;
  const smallest = Math.min(12, opts.filter((o) => o.gal < need).length + 1);
  const tooBig = need > opts[11].gal;
  const fits = opts.filter((o) => o.gal >= need);
  const least = fits.length ? fits.reduce((a, o) => (o.leftPct < a.leftPct - 1e-9 ? o : a)).n : null;
  const ov = parseInt(p.blocks, 10);
  const used = ov >= 1 && ov <= 12 ? ov : smallest;
  const s = opts[used - 1];
  const shop = [
    { k: "rock", name: "Aeration rock: " + p.rock, bags: s.rockB, need: s.C * r, bought: s.rockB * rock.vol, cost: s.rockB * pr(rock.price), it: rock },
    { k: "biochar", name: "Biochar (homemade)", bags: null, need: s.H * bc, bought: null, cost: null },
    { k: "coco", name: "Coco coir blocks", bags: used, need: s.C, bought: s.C, cost: used * pr(coco.price), it: coco },
    { k: "compost", name: "Compost", bags: s.compB, need: s.C * 2 / 3, bought: s.compB * comp.vol, cost: s.compB * pr(comp.price), it: comp },
    { k: "bark", name: "Pine bark fines", bags: s.barkB, need: s.C * b, bought: s.barkB * bark.vol, cost: s.barkB * pr(bark.price), it: bark },
    { k: "hulls", name: "Rice hulls", bags: s.hullB, need: s.C * hs, bought: s.hullB * hull.vol, cost: s.hullB * pr(hull.price), it: hull },
    { k: "castings", name: "Worm castings", bags: s.castB, need: s.C / 3, bought: s.castB * cast.vol, cost: s.castB * pr(cast.price), it: cast },
  ];
  const customGal = num(p.batchGal);
  const batchCuft = customGal > 0 ? customGal / GPC : s.H;
  const premixCups = batchCuft * cpc;
  const cr = core(), parts = cr.reduce((a, c) => a + c.parts, 0);
  const premix = cr.map((c) => {
    const cups = parts ? c.parts / parts * premixCups : 0, lbs = c.cpl > 0 ? cups / c.cpl : 0;
    const perLb = c.it.size > 0 ? c.it.price / c.it.size : NaN;
    return { ...c, cups, gal: cups / 16, lbs, perLb, perBag: lbs > 0 ? c.it.size / lbs : NaN, cost: lbs * perLb };
  });
  return { p, pot, pots, r, b, hs, bc, cpc, coco, rock, opts, need, smallest, tooBig, least, used, s, shop, customGal, batchCuft, premixCups, premix, parts };
}

function patchChildren(a, b) {
  const ac = [...a.childNodes], bc = [...b.childNodes];
  bc.forEach((n, i) => { if (i < ac.length) patch(ac[i], n); else a.appendChild(n); });
  for (let i = bc.length; i < ac.length; i++) ac[i].remove();
}
function patch(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType === 3 || a.nodeType === 8) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.nodeType !== 1) return;
  [...a.attributes].forEach((at) => { if (!b.hasAttribute(at.name)) a.removeAttribute(at.name); });
  [...b.attributes].forEach((at) => { if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); });
  const tag = a.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") { if (a !== document.activeElement && a.value !== b.value) a.value = b.value; return; }
  patchChildren(a, b);
  if (tag === "SELECT" && a !== document.activeElement && a.value !== b.value) a.value = b.value;
}

  rows.push([], ["Premix ingredient", "Cups", "Lbs", "Cost ($)"]);
  c.premix.forEach((x) => rows.push([x.name, x.cups.toFixed(1), x.lbs.toFixed(2), isFinite(x.cost) ? x.cost.toFixed(2) : ""]));
  return rows.map((r) => r.map(q).join(",")).join("\n");
}

window.addEventListener("hashchange", route);
route();

(async () => {
  const [d, dl] = await Promise.all(["db", "downloads"].map((n) => (window.claude?.use ? window.claude.use(n) : Promise.resolve(null))));
  downloads = dl;
  if (!d) {
    KEYS.forEach((k) => { try { const v = localStorage.getItem("soil-guide:" + k); if (v) S[k] = merge(k, JSON.parse(v)); } catch { /* unavailable */ } });
    setStatus("Saving on this device only");
    lastTab = null; render();
    return;
  }
  db = d;
  let first = KEYS.length;
  KEYS.forEach((k) => db.doc("app/" + k).onSnapshot((snap) => {
    if (timers[k] || inflight[k] || snap.metadata.hasPendingWrites) return;
    if (snap.exists) S[k] = merge(k, JSON.parse(JSON.stringify(snap.data())));
    if (first > 0 && --first === 0) setStatus("All changes saved");
    render();
  }, () => setStatus("Lost the connection. Reload to keep saving.")));
  render();
})();
</script>
